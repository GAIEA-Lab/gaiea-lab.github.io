# Research themes used to tag and filter projects on the Projects page.
# The project Google Form's "Research Theme" answers must match these names
# (or an alias in research_theme_aliases.yml), or the sync script will fail.
# Colors are badge backgrounds behind white text; darker_color is the selected state.

- name: Computer Vision
  color: "#3f6e70"
  darker_color: "#2a4d4f"

- name: Multimodal Modeling
  color: "#8a6a3b"
  darker_color: "#664d29"

- name: Biodiversity Monitoring
  color: "#5b7a34"
  darker_color: "#425a25"
